<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coordinador</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"href="{{ url_for('static', filename='css/Coordinador/styleCoordinador.css') }}" />
    <!-- Bootstrap CSS -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> -->

  </head>
  <body>
    <header>
      <div class="top-bar">
        <form action="/auth/logout" method="POST" >
          <button>Coordinador</button>
          <button type="submit">Cerrar Sesión</button>          
        </form>
      </div>
      <nav class="navbar">
        <img
          src="{{ url_for('static', filename='images/logo-UNESCO.png') }}"
          alt="UNESCO Logo"
          class="logo"
        />
        <ul>
          <li><a href="#">Inicio</a></li>
          <li><a href="#">Contactos</a></li>
          <li><a href="#">Sobre Nosotros</a></li>
          <li><a href="#">Coordinador</a></li>
        </ul>
        <img
          src="{{ url_for('static', filename='images/umsalogo.png') }}"
          alt="Logo Derecho"
          class="logo"
        />
      </nav>
    </header>

    <main>
      <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
          <h1>BIENVENIDO COORDINADOR</h1>
          <h3>{{ nombre }}<br>{{ apellidos }}</h3>
          <h2>Funciones</h2>

          <button class="menu-btn" onclick="showSection('usuarios/coor/estudiantes')">Estudiantes</button>
          <button class="menu-btn" onclick="showSection('usuarios/coor/expositores')">Ponentes</button>
          <button class="menu-btn" onclick="showSection('eventos/coor/eventos')">Eventos</button>
          <button class="menu-btn" onclick="showSection('cursos/coor/cursos')">Cursos</button>
        </div>

        <!-- Contenido -->
        <section id="contenido">
          <!-- Aquí se mostrará el CRUD correspondiente -->
        </section>
      </div>
    </main>

    <script>
      function showSection(section) {
        fetch(`/${section}`)
          .then((response) => response.text())
          .then((html) => {
            document.getElementById("contenido").innerHTML = html;
          });
      }

    </script>
    <!-- Bootstrap JS -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> -->

  </body>
</html>
