<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coordinador</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"href="{{ url_for('static', filename='css/Coordinador/styleCoordinador.css') }}" />
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> -->

  </head>
  <body>
<header>
  <div class="top-bar">
    <div class="logo-back">
      <img class="logo" src="../../static/images/TWAS_Logo.webp" />
    </div>
    <h1 class="titulo">GESTION COORDINADOR</h1>
    <div class="acciones-derecha">
      <div class="top-actions">
        <form action="/auth/logout" method="POST">
          <button onclick="location.href='/estudiante'">Coordinador</button>
          <button type="submit">Cerrar Sesión</button>
        </form>
      </div>
      <div class="logou">
        <img class="logo-umsa" src="../../static/images/umsalogo.webp" />
      </div>
    </div>
  </div>

  <nav class="navbar">
    <img
      src="{{ url_for('static', filename='images/logo-UNESCO.png') }}"
      alt="UNESCO Logo"
      class="logo"
    />
    <ul>
      <li><a href="#">Inicio</a></li>
      <li><a href="#">Contactos</a></li>
      <li><a href="#">Sobre Nosotros</a></li>
      <li><a href="#">Coordinador</a></li>
    </ul>
    <img
      src="{{ url_for('static', filename='images/umsalogo.png') }}"
      alt="Logo Derecho"
      class="logo"
    />
  </nav>
</header>

    <main>
      <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
          <h1>BIENVENIDO COORDINADOR</h1>
          <h3>{{ nombre }}<br>{{ apellidos }}</h3>
          <h2>Funciones</h2>
          <button class="menu-btn" onclick="showSection('estudiantes')">
            Estudiantes
          </button>
          <button class="menu-btn" onclick="showSection('expositores')">
            Expositores
          </button>
          <button class="menu-btn" onclick="showSection('cursos')">
            Cursos
          </button>
          <button class="menu-btn" onclick="showSection('eventos')">
            Eventos
          </button>
        </div>

        <!-- Contenido -->
        <section id="contenido">
          <!-- Aquí se mostrará el CRUD correspondiente -->
        </section>
      </div>
    </main>

    <script>
      function showSection(section) {
        fetch(`/coordinador/${section}`)
          .then((response) => response.text())
          .then((html) => {
            document.getElementById("contenido").innerHTML = html;
          });
      }
    </script>
  </body>
</html>
