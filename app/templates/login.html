<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login Química</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <div class="back-arrow">←</div>
      <h1>Cursos Postgrado<br />Carrera de Química<br /><span>3ra Versión</span></h1>
      <p>¡Bienvenido! Por favor ingrese su cuenta.</p>
      <form class="login-form" action="/" method="POST">
        <label for="email">Dirección de Correo Electrónico</label>
        <input type="email" id="email" name="email" required />
        <label for="password">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" required />

        <div class="options">
          <label><input type="checkbox" name="recuerdame"> Recuérdame</label>
          <a href="{{ url_for('auth.forgot_password') }}">¿Olvidé mi contraseña?</a>
        </div>
        <button type="submit" class="login-btn">Iniciar Sesión</button>
      </form>

    </div>
    <div class="right-panel">
      <img src="/static/images/Flag_of_UNESCO.png" alt="UNESCO Logo">
    </div>
  </div>
</body>
</html>
